name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (host build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo .github/scripts/apt-mirror.sh
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libcapstone-dev

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DHYDA_BUILD_LIFTER=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-pe:
    name: Windows PE (cross-compile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo .github/scripts/apt-mirror.sh
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Configure
        run: >
          cmake -S . -B build-win -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-x86_64.cmake
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-win --parallel